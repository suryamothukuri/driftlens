[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "driftlens"
version = "0.1.0"
description = "General-purpose semantic drift detection engine for versioned document corpora"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "DriftLens", email = "suryatejam2312@gmail.com"}]
readme = "README.md"
keywords = ["nlp", "semantic-drift", "document-intelligence", "embeddings", "clustering"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "sentence-transformers>=2.7",
    "umap-learn>=0.5",
    "hdbscan>=0.8",
    "pandera>=0.18",
    "tqdm>=4.66",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "click>=8.1",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.35", "altair>=5.0", "matplotlib>=3.8"]
dev = ["pytest>=8.0", "ruff>=0.4", "pytest-cov>=5.0", "requests-mock>=1.11.0"]

[project.scripts]
driftlens = "driftlens.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501", "N806", "W293"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
